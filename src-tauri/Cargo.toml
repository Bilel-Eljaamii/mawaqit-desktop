[package]
name = "mawaqit_desktop"
version = "0.11.0"
description = "Mawaqit Desktop"
authors = ["Bilel Eljaamii"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mawaqit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mawaqit-api = { version = "0.5.1"}
tauri = { version = "2.11.6", features = ["image", "tray-icon"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = "0.4.45"
thiserror = "2.0.21"
tokio = "1.53.1"
tauri-plugin-autostart = "=2.7.0"
image = "0.25.10"
dirs = "7.0.0"
tauri-plugin-notification = "=2.5.1"
# Native file picker for the per-prayer custom athan sound.
tauri-plugin-dialog = "=2.8.1"
rodio = { version = "0.22.2", features = ["symphonia-mp3"] }
tauri-plugin-global-shortcut = "=2.4.0"
# Built-in Tor: the Tor Project's Rust client, embedded in-process (see
# infrastructure/builtin_tor.rs). Exact-pinned — 0.x API churns between
# minors, same drift trap as the tauri plugin pins. MSRV 1.92.
arti-client = { version = "=0.47.0", optional = true }
# tor-dirmgr (via arti-client) uses rusqlite WITHOUT bundled sqlite: on
# non-Linux hosts that dies at link time ("cannot open input file
# 'sqlite3.lib'" — first Windows CI build). Arti's application notes tell
# embedders to enable the bundled feature; it compiles sqlite from source
# on every platform, which also makes the Linux builds self-contained.
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
# Adhan notification with a "Stop athan" button on Windows.
tauri-winrt-notification = "0.8.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Notification actions (click to stop the athan) need the freedesktop
# notification API directly; the Tauri plugin has no action support here.
notify-rust = "4.18.0"

[features]
# Production/standalone builds embed the frontend (`../dist`) and serve it
# through the tauri protocol. Without this feature the binary expects the
# Vite dev server on localhost:1420 (`pnpm tauri dev`) and shows
# "Could not connect to localhost" when it is not running.
custom-protocol = ["tauri/custom-protocol"]
# Embedded Tor (Arti) so the Tor toggle works with zero external setup.
# On by default; off-variant builds (e.g. the Windows-from-Linux cross
# build, which cannot compile bundled sqlite) fall back to
# external-proxy mode via the config file. CI builds natively per
# platform and keeps this on.
built-in-tor = ["dep:arti-client"]
default = ["built-in-tor"]
