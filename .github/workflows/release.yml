name: "Release"

# Runs when a `v*` tag is pushed and publishes installers for every desktop
# target as assets of the GitHub release:
#   Linux (amd64 + arm64):  .deb / .rpm / .AppImage   (bundle.targets: all)
#   Windows:                .msi / -setup.exe (NSIS)
#   macOS (universal):      .app / .dmg
#
# The release name comes from tauri.conf.json (`v__VERSION__`), NOT from the
# pushed tag — the `verify` job fails fast when they drift. Before tagging:
#   pnpm sync:version && git commit && git tag v<version> && git push --tags

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: tag must match tauri.conf.json version
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version v$VERSION."
            echo "::error::Run 'pnpm sync:version', commit, then delete and re-push the tag."
            exit 1
          fi

  test:
    # never tag from a red suite: same gates as ci.yml, on the tagged commit
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v4

      # src-tauri depends on the sibling mawaqit-api via a relative path
      # (../../mawaqit-api). Place that public repo exactly where cargo
      # resolves it: one level above the desktop checkout.
      - name: checkout sibling mawaqit-api
        run: git clone --depth 1 https://github.com/Bilel-Eljaamii/mawaqit-api.git ../mawaqit-api

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: frontend gates
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm build

      - name: rust gates
        run: |
          cargo test --workspace
          cargo clippy --workspace

  release:
    permissions:
      contents: write
    needs: [verify, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary for Intel + Apple Silicon.
          - platform: macos-latest
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            args: --target universal-apple-darwin
          - platform: ubuntu-24.04
            targets: ""
            args: ""
          # Native arm64 build (no cross toolchain needed). The free
          # ubuntu-24.04-arm runners are available to public repos — drop
          # this entry if the repo is private without larger runners.
          - platform: ubuntu-24.04-arm
            targets: "aarch64-unknown-linux-gnu"
            args: --target aarch64-unknown-linux-gnu
          - platform: windows-latest
            targets: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # src-tauri depends on the sibling mawaqit-api via a relative path
      # (../../mawaqit-api). Place that public repo exactly where cargo
      # resolves it: one level above the desktop checkout.
      - name: checkout sibling mawaqit-api
        run: git clone --depth 1 https://github.com/Bilel-Eljaamii/mawaqit-api.git ../mawaqit-api

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Mawaqit Desktop v__VERSION__"
          releaseBody: "See the assets below for the desktop app."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
