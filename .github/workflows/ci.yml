name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Frontend gates
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm build

      - name: Rust gates
        run: |
          cargo test --workspace
          cargo clippy --workspace
      # `cargo test --workspace` covers the mawaqit-api crate too — the
      # monorepo keeps everything together, including its hostile/fuzz suites.
