name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # src-tauri depends on the sibling mawaqit-api via a relative path
      # (../../mawaqit-api). Place that public repo exactly where cargo
      # resolves it: one level above the desktop checkout.
      - name: checkout sibling mawaqit-api
        run: git clone --depth 1 https://github.com/Bilel-Eljaamii/mawaqit-api.git ../mawaqit-api

      - uses: pnpm/action-setup@v4
      # version comes from package.json `packageManager` — passing one here
      # too makes the action fail with ERR_PNPM_BAD_PM_VERSION-style conflict

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: install Tauri system dependencies (linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libasound2-dev patchelf

      - name: Frontend gates
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm build

      - name: Rust gates
        run: |
          cargo test --workspace
          cargo clippy --workspace
      # `cargo test --workspace` covers the mawaqit-api crate too — the
      # monorepo keeps everything together, including its hostile/fuzz suites.
