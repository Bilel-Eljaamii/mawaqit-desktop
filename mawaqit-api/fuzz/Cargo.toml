[package]
name = "mawaqit-api-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
chrono = "0.4"
libfuzzer-sys = "0.4"
mawaqit-api = { path = ".." }
serde_json = "1"

[[bin]]
name = "parse_page"
path = "fuzz_targets/parse_page.rs"
test = false
doc = false
bench = false

[[bin]]
name = "conf_pipeline"
path = "fuzz_targets/conf_pipeline.rs"
test = false
doc = false
bench = false

# Own workspace root: the fuzz crate is deliberately not a member of the
# parent workspace (libFuzzer needs nightly; the app builds on stable).
[workspace]
