[package]
name = "mawaqit-api"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Keyless Rust client for mawaqit.net prayer times"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
# reqwest 0.13 defaults to rustls (no OpenSSL), so this cross-compiles to
# Windows MSVC from Linux as-is.
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
